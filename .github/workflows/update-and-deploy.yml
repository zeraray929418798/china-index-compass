name: Update China index data and deploy

on:
  schedule:
    # 10:00 UTC weekdays = 18:00 Asia/Shanghai, after the A-share close.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch China index data
        run: python scripts/fetch_data.py

      - name: Build pages and data
        run: python scripts/build_site.py

      - name: Persist raw data and generated data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update China index data $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: china-index-data-${{ github.run_id }}
          path: |
            site/data/*.json
            site/data/*_daily.csv
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment summary
        run: |
          DATA_DATE=$(python -c "import json; print(json.load(open('site/data/hub.json', encoding='utf-8'))['as_of'])")
          echo "### China index dashboard deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Data as of: ${DATA_DATE}" >> "$GITHUB_STEP_SUMMARY"
